<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>レシート</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --label:#000000;
    --secondary:rgba(60,60,67,.6); --tertiary:rgba(60,60,67,.3);
    --sep:rgba(60,60,67,.29); --fill:rgba(118,118,128,.12);
    --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
    --bar:rgba(249,249,249,.94);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000000; --card:#1C1C1E; --label:#FFFFFF;
      --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
      --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
      --bar:rgba(22,22,24,.92);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Helvetica Neue",system-ui,sans-serif;
    color:var(--label);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }

  /* ===== ページャ（左右スワイプ） ===== */
  .pager{
    display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .pager::-webkit-scrollbar{display:none}
  .page{
    flex:0 0 100%;width:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;
    scroll-snap-align:start;scroll-snap-stop:always;-webkit-overflow-scrolling:touch;
    padding:0 16px calc(72px + env(safe-area-inset-bottom));
  }
  .inner{max-width:480px;margin:0 auto}

  /* ===== タブバー ===== */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--sep);
  }
  .tab{
    flex:1;background:none;border:none;font:inherit;font-size:10px;letter-spacing:.02em;
    color:var(--secondary);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer
  }
  .tab svg{width:26px;height:26px;display:block}
  .tab.on{color:var(--blue)}

  h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:28px 0 16px}
  .group-label{font-size:13px;color:var(--secondary);margin:26px 4px 7px;display:flex;justify-content:space-between}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative}
  .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .row .grow{flex:1;min-width:0}
  .value{color:var(--secondary);font-variant-numeric:tabular-nums}
  .tap{cursor:pointer}
  .primary,.secondary{width:100%;border:none;font:inherit;font-size:17px;font-weight:600;
    height:50px;border-radius:14px;cursor:pointer;margin-top:12px}
  .primary{background:var(--blue);color:#fff}
  .secondary{background:var(--fill);color:var(--blue)}
  .primary:disabled{opacity:.45}
  .danger{background:none;border:none;color:var(--red);font:inherit;font-size:17px;width:100%;padding:14px 0 0;cursor:pointer}
  .linkbtn{display:block;width:100%;background:none;border:none;font:inherit;font-size:15px;
    color:var(--blue);padding:12px 0 0;cursor:pointer}
  input[type=file]{display:none}
  .num{font-variant-numeric:tabular-nums}

  /* ===== 撮影 ===== */
  .dropzone{background:var(--card);border-radius:16px;padding:24px 20px;text-align:center;cursor:pointer}
  .dropzone .big{font-size:17px;font-weight:600}
  .dropzone .sm{font-size:13px;color:var(--secondary);margin-top:4px}
  .stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4}
  .stage video{width:100%;height:100%;object-fit:cover;display:block}
  .shutterbar{position:absolute;left:0;right:0;bottom:0;padding:14px;display:flex;align-items:center;
    justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.5);cursor:pointer}
  .shutterbar button.txt{background:none;border:none;color:#fff;font:inherit;font-size:15px;cursor:pointer;min-width:72px}
  .tray{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px}
  .tray img{width:52px;height:68px;object-fit:cover;border-radius:8px;flex:0 0 auto}
  .tray .cnt{font-size:13px;color:var(--secondary);align-self:center;flex:0 0 auto;padding:0 4px}

  .progress{display:none;margin-top:12px;background:var(--card);border-radius:var(--radius);padding:14px 16px}
  .progress.on{display:block}
  .ptop{display:flex;align-items:center;gap:10px}
  .spinner{width:18px;height:18px;border-radius:50%;flex:0 0 auto;
    border:2px solid var(--tertiary);border-top-color:var(--blue);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ptop b{font-size:15px;font-weight:500;flex:1}
  .ptop span{font-size:13px;color:var(--secondary);font-variant-numeric:tabular-nums}
  .track{height:4px;background:var(--fill);border-radius:2px;margin-top:12px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--blue);width:0;border-radius:2px;transition:width .3s}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}.track i{transition:none}}

  /* ===== 読み取り結果 ===== */
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;position:relative}
  .item+.item::before{content:"";position:absolute;top:0;left:12px;right:0;height:.5px;background:var(--sep)}
  .item img{width:44px;height:58px;object-fit:cover;border-radius:8px;background:var(--fill);flex:0 0 auto}
  .fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .fields input{border:none;background:none;font:inherit;color:var(--label);padding:0;width:100%}
  .fields input:focus{outline:none}
  .fields .r1{display:flex;align-items:baseline;gap:6px}
  .fields input[type=date]{font-size:12px;color:var(--secondary);flex:0 0 auto;width:105px}
  .fields .st{font-size:11px;color:var(--secondary)}
  .fields .st.low{color:var(--orange)}
  .fields .st.ng{color:var(--red)}
  .fields .amtwrap{display:flex;align-items:baseline;gap:2px}
  .fields .amtwrap span{font-size:15px;font-weight:600}
  .fields input[type=number]{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .fields input.memo{font-size:13px;color:var(--secondary)}
  .item .x{background:none;border:none;color:var(--secondary);font-size:17px;padding:4px;cursor:pointer;flex:0 0 auto}
  .item.busy{opacity:.55}

  /* ===== 支出 ===== */
  .mnav{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;border-bottom:.5px solid var(--sep)}
  .mnav b{font-size:15px;font-weight:600}
  .mnav button{background:none;border:none;color:var(--blue);font-size:17px;padding:6px 12px;cursor:pointer}
  .total{padding:18px 16px}
  .total .big{font-size:40px;font-weight:700;letter-spacing:.4px;font-variant-numeric:tabular-nums}
  .total .sub{font-size:13px;color:var(--secondary);margin-top:2px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:84px;padding:14px 16px 0}
  .bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .bars i{display:block;background:var(--fill);border-radius:4px;min-height:3px}
  .bars i.on{background:var(--blue)}
  .bars small{font-size:11px;color:var(--secondary);text-align:center;margin-top:6px}

  .cal{padding:10px 8px 14px}
  .cal .wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .cal .wd span{text-align:center;font-size:11px;color:var(--secondary)}
  .cal .wd span:first-child{color:var(--red)}
  .cal .wd span:last-child{color:var(--blue)}
  .cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal .d{border:none;background:none;font:inherit;color:var(--label);border-radius:8px;
    padding:4px 1px 5px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
  .cal .d.blank{visibility:hidden}
  .cal .d .n{font-size:13px;font-variant-numeric:tabular-nums}
  .cal .d .v{font-size:9px;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
  .cal .d.today .n{font-weight:700}
  .cal .d.on{background:var(--blue);color:#fff}
  .cal .d.on .v{color:rgba(255,255,255,.9)}
  .cal .d.on .n{font-weight:700}

  .rec{display:flex;align-items:center;gap:10px;padding:11px 16px;position:relative;cursor:pointer}
  .rec+.rec::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .rec .d{font-size:12px;color:var(--secondary);flex:0 0 46px;font-variant-numeric:tabular-nums}
  .rec .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .rec .t.none{color:var(--tertiary)}
  .rec .a{font-variant-numeric:tabular-nums;font-weight:500;flex:0 0 auto}
  .rec .chev{color:var(--tertiary);font-size:15px;flex:0 0 auto}
  .empty{padding:22px 16px;text-align:center;color:var(--secondary);font-size:15px}

  /* ===== 単価くらべ ===== */
  .frow{display:flex;align-items:center;gap:12px;padding:9px 16px;min-height:44px;position:relative}
  .frow+.frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .frow label{flex:0 0 76px;font-size:15px;color:var(--label)}
  .frow input,.frow select{
    flex:1;min-width:0;border:none;background:none;font:inherit;font-size:17px;color:var(--label);
    padding:0;text-align:right;-webkit-appearance:none;appearance:none
  }
  .frow select{color:var(--secondary);text-align:right;text-align-last:right;direction:rtl}
  .frow input:focus,.frow select:focus{outline:none}
  .frow .suf{color:var(--secondary);font-size:15px;flex:0 0 auto}
  .frow.split{gap:8px}
  .frow.split .sub{display:flex;align-items:center;gap:6px;flex:1;min-width:0}

  .pc-item{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;position:relative}
  .pc-item.best{box-shadow:inset 3px 0 0 var(--green)}
  .pc-head{display:flex;align-items:center;gap:8px}
  .pc-name{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc-badge{background:var(--green);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;flex:0 0 auto}
  .pc-diff{font-size:12px;font-weight:600;color:var(--orange);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .pc-unit{margin-top:4px;display:flex;align-items:baseline;gap:5px}
  .pc-unit b{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
  .pc-unit i{font-style:normal;font-size:13px;color:var(--secondary)}
  .pc-meta{margin-top:1px;font-size:12px;color:var(--secondary);font-variant-numeric:tabular-nums}
  .pc-track{height:4px;background:var(--fill);border-radius:2px;margin-top:10px;overflow:hidden}
  .pc-track i{display:block;height:100%;background:var(--tertiary);border-radius:2px}
  .pc-item.best .pc-track i{background:var(--green)}
  .pc-acts{position:absolute;right:10px;bottom:10px;display:flex;gap:14px}
  .pc-acts button{background:none;border:none;font:inherit;font-size:13px;color:var(--blue);padding:2px;cursor:pointer}
  .pc-acts button.del{color:var(--red)}
  .pc-bar{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 8px}
  .pc-bar h2{margin:0;font-size:13px;font-weight:400;color:var(--secondary)}
  .pc-bar select{border:none;background:none;font:inherit;font-size:13px;color:var(--blue);padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
  .pc-empty{border-radius:var(--radius);background:var(--card);padding:26px 16px;text-align:center;color:var(--secondary);font-size:15px}
  .msg{font-size:13px;color:var(--red);padding:10px 4px 0;margin:0}
  .msg[hidden]{display:none}

  /* ===== シート ===== */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:13}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--bg);
    border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-width:480px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:36px;height:5px;border-radius:3px;background:var(--tertiary);margin:0 auto 10px}
  .sheet h2{font-size:20px;font-weight:600;margin:4px 4px 14px}
  .sheet input{border:none;background:none;font:inherit;font-size:15px;color:var(--label);flex:1;min-width:0;padding:0;text-align:right}
  .sheet input[type=password]{text-align:left}
  .sheet input:focus{outline:none}
  .conf{font-size:13px;padding:10px 16px;color:var(--secondary)}
  .status{font-size:13px;color:var(--secondary);text-align:center;padding:16px 0 0}
  .status.warn{color:var(--orange)}
</style>
</head>
<body>

<div class="pager" id="pager">

  <!-- ========== 1ページ目：支出 ========== -->
  <section class="page" id="page0"><div class="inner">
    <h1>レシート</h1>

    <div id="pickBox">
      <div class="dropzone tap" id="openCam">
        <div class="big">カメラで撮る</div>
        <div class="sm">続けて何枚でも撮影 → まとめてアップロード</div>
      </div>
      <button class="secondary" id="pickLib">ライブラリから選ぶ</button>
      <input type="file" id="file" accept="image/*" multiple>
      <button class="linkbtn" id="toManual">手入力で1件追加</button>
    </div>

    <div id="camBox" hidden>
      <div class="stage">
        <video id="cam" playsinline muted></video>
        <div class="shutterbar">
          <button class="txt" id="camClose">閉じる</button>
          <button class="shutter" id="shutter" aria-label="撮影"></button>
          <button class="txt" id="camDone">読み取る</button>
        </div>
      </div>
      <div class="tray" id="tray"></div>
    </div>

    <div class="progress" id="prog">
      <div class="ptop"><div class="spinner"></div><b id="pTitle">解析中</b><span id="pTime">0.0s</span></div>
      <div class="track"><i id="pBar"></i></div>
    </div>

    <div id="queueBox" hidden>
      <p class="group-label"><span>読み取り結果</span><span id="qCount"></span></p>
      <div class="card" id="queue"></div>
      <button class="primary" id="saveAll">まとめて記録する</button>
      <button class="secondary" id="clearAll">すべて破棄</button>
    </div>

    <p class="group-label"><span>支出</span></p>
    <div class="card">
      <div class="mnav"><button id="prevM" aria-label="前の月">‹</button><b id="mLabel">-</b><button id="nextM" aria-label="次の月">›</button></div>
      <div class="total"><div class="big" id="mTotal">¥0</div><div class="sub" id="mSub">0件</div></div>
      <div class="bars" id="bars"></div>
    </div>

    <p class="group-label"><span>記録</span><span id="filterNote"></span></p>
    <div class="card">
      <div class="cal">
        <div class="wd"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
        <div class="days" id="cal"></div>
      </div>
    </div>
    <div class="card" id="list" style="margin-top:10px"></div>

    <p class="group-label"><span>設定</span></p>
    <div class="card">
      <div class="row tap" id="openSettings"><span class="grow">パスワード</span><span class="value" id="syncState">未設定</span><span class="value">›</span></div>
      <div class="row"><span class="grow">今日の読み取り</span><span class="value" id="quotaState">-</span></div>
      <div class="row tap" id="doExport"><span class="grow" style="color:var(--blue)">CSVで書き出す</span></div>
    </div>

    <p class="status" id="statusMsg"></p>
  </div></section>

  <!-- ========== 2ページ目：単価くらべ ========== -->
  <section class="page" id="page1"><div class="inner">
    <h1>単価くらべ</h1>

    <div class="card">
      <div class="frow"><label for="f-name">商品名</label>
        <input id="f-name" type="text" placeholder="省略可"></div>
      <div class="frow"><label for="f-price">価格</label>
        <input id="f-price" class="num" type="number" inputmode="decimal" min="0" step="any" placeholder="298"><span class="suf">円</span></div>
      <div class="frow"><label for="f-tax">税</label>
        <select id="f-tax">
          <option value="1">税込</option>
          <option value="1.08">税抜（+8%）</option>
          <option value="1.1">税抜（+10%）</option>
        </select></div>
      <div class="frow split"><label for="f-qty">内容量</label>
        <div class="sub"><input id="f-qty" class="num" type="number" inputmode="decimal" min="0" step="any" placeholder="500">
        <select id="f-unit" style="flex:0 0 74px">
          <option value="g">g</option><option value="kg">kg</option>
          <option value="ml">ml</option><option value="L">L</option>
          <option value="個">個</option><option value="枚">枚</option>
          <option value="m">m</option>
        </select></div></div>
      <div class="frow"><label for="f-pack">入数</label>
        <input id="f-pack" class="num" type="number" inputmode="numeric" min="1" step="1" value="1"><span class="suf">袋</span></div>
    </div>
    <p class="msg" id="msg" hidden></p>
    <button class="primary" id="add">この商品を追加</button>

    <div id="out"></div>

    <div id="foot" hidden><button class="secondary" id="clear">すべて消す</button></div>
  </div></section>

</div>

<nav class="tabbar">
  <button class="tab on" id="tab0" data-i="0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3.5h14v15.2l-2.3-1.4-2.35 1.4-2.35-1.4-2.35 1.4L7.3 17.3 5 18.7z"/>
      <path d="M8.6 8h6.8M8.6 11.4h6.8M8.6 14.2h3.6"/>
    </svg>
    支出
  </button>
  <button class="tab" id="tab1" data-i="1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4.6v15M8.4 19.6h7.2M4.2 7.6h15.6M12 4.6l-7.8 3 7.8-3 7.8 3"/>
      <path d="M1.9 13.2a2.3 2.3 0 0 0 4.6 0L4.2 7.6z"/>
      <path d="M17.5 13.2a2.3 2.3 0 0 0 4.6 0L19.8 7.6z"/>
    </svg>
    単価
  </button>
</nav>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheetEdit">
  <div class="grab"></div>
  <h2>記録を編集</h2>
  <div class="card">
    <div class="row"><span class="grow">日付</span><input type="date" id="eDate"></div>
    <div class="row"><span class="grow">金額</span><span class="value">¥</span><input type="number" id="eAmount" inputmode="numeric"></div>
    <div class="row"><span class="grow">内容</span><input type="text" id="eItems" placeholder="食料品ほか"></div>
  </div>
  <button class="primary" id="eSave">保存する</button>
  <button class="secondary" id="eCancel">やめる</button>
  <button class="danger" id="eDelete">この記録を削除</button>
</div>

<div class="sheet" id="sheetSettings">
  <div class="grab"></div>
  <h2>パスワード</h2>
  <div class="card"><div class="row"><input type="password" id="secret" placeholder="パスワード（APP_SECRET）" autocomplete="current-password"></div></div>
  <p class="conf">この端末にのみ保存され、次回からは入力不要です。APIキーはサーバー側にあり、アプリからは見えません。</p>
  <button class="primary" id="saveSecret">保存して接続</button>
  <button class="secondary" id="closeSettings">閉じる</button>
</div>

<script>
/* ============================================================
   ページ切り替え（左右スワイプ ⇄ タブバー）
   ============================================================ */
(function(){
  var pager=document.getElementById('pager');
  var tabs=[document.getElementById('tab0'),document.getElementById('tab1')];
  var cur=0,raf=0;
  function sync(){
    var i=Math.round(pager.scrollLeft/pager.clientWidth);
    if(i===cur)return;
    cur=i;tabs.forEach(function(t,n){t.classList.toggle('on',n===i)});
  }
  pager.addEventListener('scroll',function(){
    if(raf)return;
    raf=requestAnimationFrame(function(){raf=0;sync()});
  },{passive:true});
  tabs.forEach(function(t){
    t.onclick=function(){
      var i=+t.dataset.i;
      pager.scrollTo({left:i*pager.clientWidth,behavior:'smooth'});
      if(cur===i){                                  // 同じタブの再タップで先頭へ
        document.getElementById('page'+i).scrollTo({top:0,behavior:'smooth'});
      }
    };
  });
  window.addEventListener('resize',function(){

  });
})();

(function(){

function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ymd(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function today(){var d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function status(m,warn){$('statusMsg').textContent=m||'';$('statusMsg').className='status'+(warn?' warn':'')}

function api(action,extra){
  if(!secret)return Promise.reject(new Error('設定でパスワードを入力してください'));
  var body={action:action,secret:secret};
  for(var k in extra)body[k]=extra[k];
  return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),referrerPolicy:'no-referrer'})
    .then(function(r){return r.json()})
    .then(function(j){
      if(!j.ok){var e=new Error(j.error==='auth'?'パスワードが違います':j.error);e.busy=!!j.busy;throw e}
      return j;
    });
}

function shrinkFrom(src,w,q){
  var c=document.createElement('canvas');
  var iw=src.videoWidth||src.naturalWidth, ih=src.videoHeight||src.naturalHeight;
  var sc=Math.min(1,w/iw);
  c.width=Math.round(iw*sc);c.height=Math.round(ih*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
function fileToImage(f){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){rej(new Error('画像を開けません'))};i.src=fr.result};
    fr.onerror=function(){rej(new Error('ファイルを読めません'))};
    fr.readAsDataURL(f);
  });
}

/* 一括解析 */
function analyze(shotList){
  if(!shotList.length){progClose();return}
  if(running){status('前の読み取りが終わってから追加してください',true);return}
  running=true;if(!$('prog').classList.contains('on'))progOpen();

  var added=shotList.map(function(s){
    var it={id:'q'+(++seq),thumb:s.thumb,b64:s.b64,date:today(),amount:'',items:'',state:'wait'};
    queue.push(it);return it;
  });
  renderQueue();

  var groups=[];
  for(var i=0;i<added.length;i+=BATCH)groups.push(added.slice(i,i+BATCH));
  var next=0,doneImgs=0,errs=0;
  progSet('レシートを解析中（0/'+added.length+'枚）',8);

  function runGroup(g,retry){
    g.forEach(function(it){it.state='busy'});renderQueue();
    return api('scan',{images:g.map(function(it){return it.b64})}).then(function(j){
      if(j.limit)$('quotaState').textContent=j.used+' / '+j.limit+'回';
      (j.results||[]).forEach(function(r,i){
        var it=g[i];if(!it)return;
        if(r.found&&r.total>0){
          it.amount=r.total;it.date=r.date||it.date;it.items=r.items||'';
          it.state=r.confidence==='low'?'low':'ok';
        }else{it.state='ng'}
      });
    }).catch(function(e){
      if(e.busy&&(retry||0)<3){                       // 1分あたりの上限 → 待って自動再試行
        progSet('混雑中のため待機しています…',null);
        return sleep(8000).then(function(){return runGroup(g,(retry||0)+1)});
      }
      errs++;g.forEach(function(it){it.state='ng'});status(e.message,true);
    });
  }
  function lane(){
    if(next>=groups.length)return Promise.resolve();
    var g=groups[next++];
    return runGroup(g,0).then(function(){
      doneImgs+=g.length;
      progSet('レシートを解析中（'+doneImgs+'/'+added.length+'枚）',8+doneImgs/added.length*92);
      renderQueue();return lane();
    });
  }
  var lanes=[];
  for(var p=0;p<Math.min(PARALLEL,groups.length);p++)lanes.push(lane());
  Promise.all(lanes).then(function(){
    progSet('完了',100);setTimeout(progClose,500);
    running=false;renderQueue();
    var ok=added.filter(function(it){return it.amount}).length;
    status(ok+'/'+added.length+'枚を読み取りました'+(errs?'（'+errs+'件エラー）':'')+' — 内容を確認して記録してください');
  });
}

      var w=max>0?Math.max(6,x.c.per/max*100):100;
      var name=x.it.name||('商品'+(i+1));
      html+='<div class="pc-item'+(i===0?' best':'')+'">'+
        '<div class="pc-head"><span class="pc-name">'+esc(name)+'</span>'+
          (i===0?'<span class="pc-badge">最安</span>':'<span class="pc-diff">+'+pct+'%</span>')+'</div>'+
        '<div class="pc-unit"><b>'+yen(per)+'</b><i>円 / '+label+'あたり</i></div>'+
        '<div class="pc-meta">'+fmtSrc(x.it,x.c)+'</div>'+
        '<div class="pc-track"><i style="width:'+w+'%"></i></div>'+
        '<div class="pc-acts"><button data-edit="'+x.it.id+'">編集</button>'+
          '<button class="del" data-del="'+x.it.id+'">削除</button></div>'+
      '</div>';
    });
  });
  out.innerHTML=html;
}

$('add').onclick=function(){
  var it=read();if(!it)return;
  if(editing!=null){items=items.map(function(x){return x.id===editing?it:x})}
  else{items.push(it)}
  reset();save();render();
};
$('out').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset.del,ed=b.dataset.edit;
  if(d){
    items=items.filter(function(x){return String(x.id)!==String(d)});
    if(String(editing)===String(d))reset();
    save();render();
  }
  if(ed){
    var it=items.filter(function(x){return String(x.id)===String(ed)})[0];if(!it)return;
    editing=it.id;
    $('f-name').value=it.name;$('f-price').value=it.price;$('f-tax').value=it.tax;
    $('f-qty').value=it.qty;$('f-unit').value=it.unit;$('f-pack').value=it.pack;
    $('add').textContent='この商品を書きかえる';
    $('page1').scrollTo({top:0,behavior:'smooth'});
  }
});
$('out').addEventListener('change',function(e){
  if(e.target.classList.contains('js-basis')){
    basis[e.target.dataset.sys]=+e.target.value;render();
  }
});
function disarm(){
  clearTimeout(armed);armed=null;
  $('clear').textContent='すべて消す';$('clear').style.color='';
}
$('clear').onclick=function(){
  if(!armed){
    $('clear').textContent='もう一度押すと全部消えます';
    $('clear').style.color='var(--red)';
    armed=setTimeout(disarm,4000);return;
  }
  disarm();items=[];reset();save();render();
};
$('page1').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT')$('add').click();
});
render();
})();
</script>
